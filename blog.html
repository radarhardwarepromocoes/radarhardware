<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blog · Radar Hardware</title>
<meta name="description" content="Reviews de hardware sem enrolação — CPUs, placas, gabinetes e periféricos testados pelo Radar Hardware." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<style>
  :root{
    --bg:#0B0E12;
    --bg-2:#0F141A;
    --surface:#141A21;
    --surface-2:#19212A;
    --line:#232C35;
    --line-2:#2C3742;
    --text:#E7ECF1;
    --muted:#8B97A5;
    --faint:#5C6773;
    --signal:#43C59E;
    --signal-dim:rgba(67,197,158,.13);
    --shopee:#EE5A38;
    --ml:#FFD400;
    --amazon:#FF9E2C;
    --f-disp:'Space Grotesk',system-ui,sans-serif;
    --f-serif:'Newsreader',Georgia,serif;
    --f-mono:'JetBrains Mono',ui-monospace,monospace;
    --wrap:1080px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:var(--f-disp);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    background-image:
      radial-gradient(900px 500px at 82% -10%, rgba(67,197,158,.06), transparent 60%),
      radial-gradient(700px 500px at 0% 0%, rgba(67,197,158,.035), transparent 55%);
    background-attachment:fixed;
  }
  a{color:inherit;text-decoration:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--wrap);margin:0 auto;padding:0 22px}

  /* ---------- header ---------- */
  .site-head{
    position:sticky;top:0;z-index:40;
    background:rgba(11,14,18,.78);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .site-head .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:18px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .dish{
    position:relative;width:34px;height:34px;flex:none;border-radius:9px;
    background:var(--surface-2);border:1px solid var(--line-2);
    display:grid;place-items:center;overflow:hidden;
  }
  .dish::before{
    content:"";position:absolute;inset:0;border-radius:inherit;
    background:conic-gradient(from 0deg, transparent 0deg, var(--signal-dim) 40deg, transparent 90deg);
    animation:sweep 3.4s linear infinite;
  }
  .dish svg{position:relative;z-index:1}
  @keyframes sweep{to{transform:rotate(360deg)}}
  .brand-name{font-weight:700;letter-spacing:-.01em;font-size:1.02rem;white-space:nowrap}
  .brand-name em{color:var(--signal);font-style:normal}
  .brand-tag{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .nav{display:flex;align-items:center;gap:8px}
  .nav a{
    font-family:var(--f-mono);font-size:.74rem;letter-spacing:.04em;color:var(--muted);
    padding:8px 12px;border-radius:8px;border:1px solid transparent;transition:.18s;
  }
  .nav a:hover{color:var(--text);border-color:var(--line-2);background:var(--surface)}
  .nav a.site-link{color:var(--signal)}

  /* ---------- list intro ---------- */
  .intro{padding:52px 0 30px}
  .eyebrow{
    font-family:var(--f-mono);font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--signal);display:inline-flex;align-items:center;gap:9px;
  }
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--signal);opacity:.7}
  .intro h1{
    font-size:clamp(2.1rem,5.4vw,3.2rem);font-weight:700;line-height:1.04;letter-spacing:-.02em;
    margin:16px 0 12px;
  }
  .intro p{color:var(--muted);max-width:52ch;font-size:1.02rem;margin:0}

  /* filter chips */
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
  .chip{
    font-family:var(--f-mono);font-size:.72rem;letter-spacing:.03em;
    padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);
    color:var(--muted);background:transparent;cursor:pointer;transition:.16s;
  }
  .chip:hover{color:var(--text);border-color:var(--faint)}
  .chip[aria-pressed="true"]{background:var(--signal-dim);border-color:var(--signal);color:var(--signal)}

  /* ---------- cards ---------- */
  .feed{padding:22px 0 80px}
  .lead{
    display:grid;grid-template-columns:1.05fr .95fr;gap:2px;
    border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--line);
    margin-bottom:32px;
  }
  .lead .cover{min-height:280px}
  .lead .body{background:var(--surface);padding:34px 34px;display:flex;flex-direction:column;justify-content:center}
  .lead h2{font-size:1.7rem;line-height:1.15;letter-spacing:-.015em;margin:14px 0 12px;font-weight:600}
  .lead .excerpt{color:var(--muted);font-family:var(--f-serif);font-size:1.06rem;line-height:1.6;margin:0 0 20px}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
  .card{
    border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);
    display:flex;flex-direction:column;transition:.2s;cursor:pointer;
  }
  .card:hover{border-color:var(--line-2);transform:translateY(-3px)}
  .card:hover .cover::after{opacity:.5}
  .card .cover{height:174px}
  .card .body{padding:20px 20px 22px;display:flex;flex-direction:column;flex:1}
  .card h3{font-size:1.14rem;line-height:1.24;letter-spacing:-.01em;margin:11px 0 9px;font-weight:600}
  .card .excerpt{color:var(--muted);font-family:var(--f-serif);font-size:.98rem;line-height:1.55;margin:0 0 16px;flex:1}

  .cat{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--signal)}
  .meta-row{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.72rem;color:var(--faint)}
  .read{display:inline-flex;align-items:center;gap:7px;font-family:var(--f-mono);font-size:.74rem;color:var(--signal);letter-spacing:.02em}
  .read svg{transition:transform .18s}
  .card:hover .read svg,.lead:hover .read svg{transform:translateX(3px)}

  /* generated cover placeholder */
  .cover{position:relative;background:var(--bg-2);overflow:hidden}
  .cover.img{background-size:cover;background-position:center}
  .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(11,14,18,.55));opacity:.7;transition:.2s;pointer-events:none}
  .cover .ph{position:absolute;inset:0;display:grid;place-items:center}
  .cover .ph svg{width:100%;height:100%;position:absolute;inset:0;opacity:.5}
  .cover .ph .pcode{
    position:relative;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;
    color:var(--muted);border:1px solid var(--line-2);background:rgba(11,14,18,.5);
    padding:8px 14px;border-radius:999px;
  }

  /* ---------- article ---------- */
  .article{padding:44px 0 90px;max-width:720px;margin:0 auto}
  .back{
    display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.75rem;
    color:var(--muted);margin-bottom:30px;transition:.16s;letter-spacing:.03em;
  }
  .back:hover{color:var(--signal)}
  .art-head{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:14px}
  .art-head h1{font-size:clamp(1.9rem,4.6vw,2.75rem);line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:14px 0 16px}
  .art-meta{display:flex;flex-wrap:wrap;align-items:center;gap:12px;font-family:var(--f-mono);font-size:.76rem;color:var(--faint)}
  .art-cover{margin:26px 0 6px;border:1px solid var(--line);border-radius:14px;overflow:hidden;height:300px}

  .prose{font-family:var(--f-serif);font-size:1.14rem;line-height:1.78;color:#DCE3EA}
  .prose p{margin:1.35em 0}
  .prose h2{font-family:var(--f-disp);font-size:1.5rem;font-weight:600;letter-spacing:-.01em;margin:1.9em 0 .5em;color:var(--text)}
  .prose h3{font-family:var(--f-disp);font-size:1.18rem;font-weight:600;margin:1.6em 0 .4em;color:var(--text)}
  .prose a{color:var(--signal);text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(67,197,158,.4)}
  .prose strong{color:var(--text);font-weight:600}
  .prose ul,.prose ol{padding-left:1.3em;margin:1.2em 0}
  .prose li{margin:.5em 0}
  .prose blockquote{
    margin:1.5em 0;padding:4px 20px;border-left:2px solid var(--signal);
    color:var(--muted);font-style:italic;
  }
  .prose img{border-radius:12px;border:1px solid var(--line);margin:1.6em 0}
  .prose hr{border:none;border-top:1px solid var(--line);margin:2.2em 0}
  .prose table{
    width:100%;border-collapse:collapse;margin:1.6em 0;font-family:var(--f-disp);font-size:.95rem;
    border:1px solid var(--line);border-radius:10px;overflow:hidden;
  }
  .prose thead th{
    background:var(--surface-2);text-align:left;font-family:var(--f-mono);font-size:.72rem;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:11px 14px;font-weight:500;
  }
  .prose tbody td{padding:11px 14px;border-top:1px solid var(--line);color:var(--text)}
  .prose tbody tr:nth-child(even){background:rgba(255,255,255,.014)}
  .prose code{font-family:var(--f-mono);font-size:.86em;background:var(--surface-2);padding:2px 6px;border-radius:5px;color:var(--signal)}

  /* ---------- buy block ---------- */
  .buy{margin:52px 0 8px;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
  .buy-head{padding:20px 24px 4px;position:relative}
  .buy-head::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,var(--signal),transparent);opacity:.55}
  .buy-head .lbl{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--signal)}
  .buy-head h3{font-family:var(--f-disp);font-size:1.3rem;font-weight:600;margin:8px 0 2px}
  .buy-head p{color:var(--muted);font-size:.9rem;margin:4px 0 0}
  .buy-list{padding:18px 24px 24px;display:flex;flex-direction:column;gap:10px}
  .store{
    display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:11px;
    border:1px solid var(--line-2);background:var(--bg-2);transition:.18s;
  }
  .store:hover{transform:translateX(4px)}
  .store .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .store .sname{font-weight:600;font-size:.98rem}
  .store .go{
    margin-left:auto;font-family:var(--f-mono);font-size:.74rem;color:var(--muted);
    display:inline-flex;align-items:center;gap:7px;transition:.16s;
  }
  .store:hover .go{color:var(--text)}
  .store.shopee:hover{border-color:var(--shopee)}
  .store.mercado:hover{border-color:var(--ml)}
  .store.amazon:hover{border-color:var(--amazon)}

  .disclaimer{margin-top:22px;padding:14px 18px;border:1px dashed var(--line-2);border-radius:10px;
    font-family:var(--f-mono);font-size:.72rem;line-height:1.6;color:var(--faint)}

  /* ---------- states / footer ---------- */
  .state{padding:80px 0;text-align:center;color:var(--muted)}
  .state .spin{width:26px;height:26px;margin:0 auto 14px;border-radius:50%;
    border:2px solid var(--line-2);border-top-color:var(--signal);animation:rot .8s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .state p{font-family:var(--f-mono);font-size:.8rem}

  footer{border-top:1px solid var(--line);padding:34px 0;color:var(--faint);font-family:var(--f-mono);font-size:.74rem}
  footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
  footer a{color:var(--muted)}
  footer a:hover{color:var(--signal)}

  :focus-visible{outline:2px solid var(--signal);outline-offset:3px;border-radius:4px}

  @media (max-width:760px){
    .lead{grid-template-columns:1fr}
    .lead .cover{min-height:200px}
    .lead .body{padding:26px 22px}
    .brand-tag{display:none}
    .nav a:not(.site-link){display:none}
    .art-cover{height:210px}
  }
  @media (prefers-reduced-motion:reduce){
    .dish::before{animation:none}
    .spin{animation:none}
    html{scroll-behavior:auto}
  }
</style>
</head>

<script>
/* ------------------------------------------------------------------ *
 *  Radar Hardware — blog engine
 *  Posts live in _posts/index.json. If that file can't be reached
 *  (e.g. previewing this file alone), the SEED below is used instead.
 * ------------------------------------------------------------------ */
const SEED = [
  {
    "slug":"ryzen-5-5600-vale-a-pena-2026",
    "title":"Ryzen 5 5600 ainda vale a pena em 2026?",
    "category":"Processador",
    "date":"2026-07-24",
    "cover":"",
    "code":"AM4 · 6C/12T",
    "excerpt":"O 5600 continua sendo o coração de qualquer build AM4 custo-benefício. Testei em jogos e trabalho pra ver se o preço atual ainda justifica.",
    "body":"O Ryzen 5 5600 é aquele processador que se recusa a envelhecer. Lançado como opção de entrada da linha 5000, ele virou o **padrão-ouro de custo-benefício** pra quem monta na plataforma AM4 sem querer gastar com DDR5.\n\n## Ficha técnica\n\n| Item | Especificação |\n| --- | --- |\n| Núcleos / Threads | 6 / 12 |\n| Clock base / boost | 3.5 / 4.4 GHz |\n| Cache L3 | 32 MB |\n| TDP | 65 W |\n| Soquete | AM4 |\n| Cooler | Wraith Stealth (incluso) |\n\n## Na prática\n\nEm 1080p com uma GPU de entrada/média (pense numa RX 6600 ou RTX 3060), o 5600 **não é gargalo** na esmagadora maioria dos jogos. Ele entrega os quadros que a placa de vídeo consegue processar e sobra fôlego pra rodar Discord, navegador e OBS ao fundo.\n\nPra trabalho — edição leve, planilhas pesadas, compilar código — os 12 threads dão conta do recado sem drama. Não é uma besta de renderização, mas ninguém compra um 5600 esperando isso.\n\n> Se o seu orçamento é apertado e você já tem uma placa-mãe AM4, esse é provavelmente o melhor real gasto no PC inteiro.\n\n## Prós e contras\n\n- **A favor:** consumo baixo (65 W), cooler incluso que dá conta, plataforma AM4 madura e barata.\n- **Contra:** sem gráficos integrados (precisa de GPU), e a plataforma AM4 é fim de linha — não espere upgrade de CPU muito além disso.\n\n## Veredito\n\nPra uma build nova focada em economia ou pra dar sobrevida a um PC AM4 antigo, o 5600 segue sendo **a escolha certa**. Só vale ficar de olho no preço: em promoção ele é imbatível; no preço cheio, às vezes o 5600G ou um usado fazem mais sentido. Confira os links abaixo antes de fechar."
  },
  {
    "slug":"gabinete-aquario-matx-vale-a-pena",
    "title":"Gabinete \"aquário\" mATX: bonito, mas esquenta?",
    "category":"Gabinete",
    "date":"2026-07-18",
    "cover":"",
    "code":"mATX · Dual-chamber",
    "excerpt":"Os gabinetes de vidro em L viraram febre nas builds compactas. Montei um mATX dentro de um pra ver se o visual cobra caro em temperatura.",
    "body":"Os gabinetes **\"aquário\"** — aqueles com dois painéis de vidro em L que deixam a build exposta por dois lados — dominaram o feed de quem monta PC bonito. Mas será que todo esse vidro sufoca as peças?\n\n## O que define um aquário\n\nÉ um gabinete de **câmara dupla**: fonte e cabos ficam escondidos atrás, e a área principal fica limpa, com a placa-mãe e a GPU em destaque. No formato mATX, ele fica compacto sem apertar demais na hora de montar.\n\n## Fluxo de ar\n\nAqui mora o detalhe. Muitos aquários priorizam o visual e deixam a entrada de ar sofrida. A regra que funcionou no meu teste:\n\n- **Ventoinhas de baixo** puxando ar frio pra dentro (intake).\n- **Ventoinha traseira/superior** jogando o ar quente pra fora (exhaust).\n- Nada de bloquear a base — mantenha o gabinete sobre uma superfície dura, não em carpete.\n\nCom uma GPU de médio consumo e o 5600, as temperaturas ficaram **totalmente sob controle**. O gargalo aparece com placas de alto TDP: aí sim o vidro cobra seu preço e você precisa caprichar nas ventoinhas.\n\n## Vale a pena?\n\nSe a build é de consumo baixo/médio e você quer **mostrar as peças**, o aquário mATX é uma delícia — ocupa pouco espaço e chama atenção. Pra hardware parrudo, escolha um modelo com boas entradas de ar frontal/inferior e não economize nas fans.\n\nAbaixo deixei as opções que testei e recomendo."
  }
];

const app = document.getElementById('app');
document.getElementById('yr').textContent = new Date().getFullYear();

const STORE_META = {
  "shopee":{cls:"shopee",color:"var(--shopee)",label:"Shopee"},
  "mercado livre":{cls:"mercado",color:"var(--ml)",label:"Mercado Livre"},
  "mercadolivre":{cls:"mercado",color:"var(--ml)",label:"Mercado Livre"},
  "amazon":{cls:"amazon",color:"var(--amazon)",label:"Amazon"}
};
function storeInfo(name){
  const k=(name||'').trim().toLowerCase();
  return STORE_META[k] || {cls:"",color:"var(--signal)",label:name||"Loja"};
}

let POSTS=[];

function fmtDate(iso){
  try{
    return new Date(iso+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  }catch(e){return iso;}
}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

const RADAR_SVG = `<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs><radialGradient id="g" cx="50%" cy="120%" r="90%">
    <stop offset="0%" stop-color="#43C59E" stop-opacity=".16"/><stop offset="70%" stop-color="#43C59E" stop-opacity="0"/>
  </radialGradient></defs>
  <rect width="400" height="220" fill="url(#g)"/>
  <g stroke="#2C3742" stroke-width="1" fill="none">
    <path d="M0 40 H400 M0 90 H400 M0 140 H400 M0 190 H400"/>
    <path d="M60 0 V220 M140 0 V220 M220 0 V220 M300 0 V220 M380 0 V220"/>
  </g>
  <circle cx="200" cy="230" r="70" stroke="#43C59E" stroke-opacity=".35" stroke-width="1" fill="none"/>
  <circle cx="200" cy="230" r="130" stroke="#43C59E" stroke-opacity=".18" stroke-width="1" fill="none"/>
</svg>`;

function coverEl(post){
  if(post.cover){
    return `<div class="cover img" style="background-image:url('${esc(post.cover)}')"></div>`;
  }
  return `<div class="cover"><div class="ph">${RADAR_SVG}<span class="pcode">${esc(post.code||post.category||'radar')}</span></div></div>`;
}
function coverElTall(post){
  if(post.cover) return `<div class="art-cover cover img" style="background-image:url('${esc(post.cover)}')"></div>`;
  return `<div class="art-cover cover"><div class="ph">${RADAR_SVG}<span class="pcode">${esc(post.code||post.category||'radar')}</span></div></div>`;
}

const ARROW=`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;

/* ---------------- list view ---------------- */
function renderList(cat){
  const cats = ['Tudo', ...Array.from(new Set(POSTS.map(p=>p.category)))];
  const active = cat || 'Tudo';
  const list = active==='Tudo' ? POSTS : POSTS.filter(p=>p.category===active);
  const sorted = [...list].sort((a,b)=> (a.date<b.date?1:-1));
  const [lead, ...rest] = sorted;

  let html = `
  <section class="intro"><div class="wrap">
    <span class="eyebrow">Blog do Radar</span>
    <h1>Reviews de hardware, sem enrolação.</h1>
    <p>Peça por peça, testadas de verdade — pra você acertar na build sem depender de review pago.</p>
    <div class="filters" role="group" aria-label="Filtrar por categoria">
      ${cats.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${c===active}">${esc(c)}</button>`).join('')}
    </div>
  </div></section>
  <section class="feed"><div class="wrap">`;

  if(!sorted.length){
    html += `<div class="state"><p>Nenhum review nesta categoria ainda.</p></div>`;
  } else {
    html += `<a class="lead" href="?post=${encodeURIComponent(lead.slug)}" data-slug="${esc(lead.slug)}">
      ${coverEl(lead)}
      <div class="body">
        <span class="cat">${esc(lead.category)}</span>
        <h2>${esc(lead.title)}</h2>
        <p class="excerpt">${esc(lead.excerpt)}</p>
        <div class="meta-row"><span>${fmtDate(lead.date)}</span><span>·</span><span class="read">Ler review ${ARROW}</span></div>
      </div>
    </a>`;

    if(rest.length){
      html += `<div class="grid">` + rest.map(p=>`
        <a class="card" href="?post=${encodeURIComponent(p.slug)}" data-slug="${esc(p.slug)}">
          ${coverEl(p)}
          <div class="body">
            <span class="cat">${esc(p.category)}</span>
            <h3>${esc(p.title)}</h3>
            <p class="excerpt">${esc(p.excerpt)}</p>
            <div class="meta-row"><span>${fmtDate(p.date)}</span><span>·</span><span class="read">Ler ${ARROW}</span></div>
          </div>
        </a>`).join('') + `</div>`;
    }
  }
  html += `</div></section>`;
  app.innerHTML = html;

  app.querySelectorAll('.chip').forEach(ch=>{
    ch.addEventListener('click',()=>renderList(ch.dataset.cat));
  });
  bindCards();
  window.scrollTo({top:0,behavior:'auto'});
}

/* ---------------- article view ---------------- */
function renderPost(slug){
  const post = POSTS.find(p=>p.slug===slug);
  if(!post){ renderList(); return; }

  let bodyHtml;
  try{ bodyHtml = window.marked ? marked.parse(post.body) : `<p>${esc(post.body)}</p>`; }
  catch(e){ bodyHtml = `<p>${esc(post.body)}</p>`; }

  const links = Array.isArray(post.links)?post.links:[];
  const buyHtml = links.length ? `
    <section class="buy">
      <div class="buy-head">
        <span class="lbl">Onde comprar</span>
        <h3>${esc(post.title.split(':')[0])}</h3>
        <p>Links de afiliado — o preço pra você é o mesmo e ajuda o Radar a seguir testando.</p>
      </div>
      <div class="buy-list">
        ${links.map(l=>{const s=storeInfo(l.loja);return `
          <a class="store ${s.cls}" href="${esc(l.url)}" target="_blank" rel="nofollow sponsored noopener">
            <span class="dot" style="background:${s.color}"></span>
            <span class="sname">${esc(s.label)}</span>
            <span class="go">abrir ${ARROW}</span>
          </a>`;}).join('')}
      </div>
    </section>
    <p class="disclaimer">Como participante de programas de afiliados, o Radar Hardware pode receber uma comissão por compras feitas através destes links, sem custo adicional pra você.</p>
  ` : '';

  app.innerHTML = `
  <article class="article"><div class="wrap" style="padding:0">
    <a class="back" href="./blog.html">${ARROW.replace('M5 12h14M13 6l6 6-6 6','M19 12H5M11 18l-6-6 6-6')} voltar aos reviews</a>
    <header class="art-head">
      <span class="eyebrow">${esc(post.category)}</span>
      <h1>${esc(post.title)}</h1>
      <div class="art-meta"><span>${fmtDate(post.date)}</span><span>·</span><span>Radar Hardware</span></div>
    </header>
    ${coverElTall(post)}
    <div class="prose">${bodyHtml}</div>
    ${buyHtml}
  </div></article>`;

  document.querySelector('.back').addEventListener('click',e=>{
    e.preventDefault(); go(null);
  });
  window.scrollTo({top:0,behavior:'auto'});
}

/* ---------------- router ---------------- */
function bindCards(){
  app.querySelectorAll('[data-slug]').forEach(a=>{
    a.addEventListener('click',e=>{ e.preventDefault(); go(a.dataset.slug); });
  });
}
function route(){
  const slug = new URLSearchParams(location.search).get('post');
  slug ? renderPost(slug) : renderList();
}
function go(slug){
  const url = slug ? `?post=${encodeURIComponent(slug)}` : location.pathname;
  history.pushState({slug}, '', url);
  route();
}
window.addEventListener('popstate', route);

/* ---------------- boot ---------------- */
(async function(){
  try{
    const res = await fetch('_posts/index.json', {cache:'no-store'});
    if(!res.ok) throw new Error('no json');
    const data = await res.json();
    POSTS = Array.isArray(data) ? data : (data.posts||[]);
    if(!POSTS.length) throw new Error('empty');
  }catch(e){
    POSTS = SEED;
  }
  route();
})();
</script>
</body>
</html>
